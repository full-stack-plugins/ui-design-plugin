name: Validate plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/validate_portable_plugin.py
      - run: python scripts/validate_markdown_links.py
      - run: python scripts/check_snapshot.py
      - run: python scripts/vendor/skill_vendor.py check
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s skills/ui-design-harness/tests
      - run: python scripts/package_plugin.py
